spring.application.name=docmind

# PostgreSQL Database (local development defaults — override in production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/docmind}
spring.datasource.username=${DATABASE_USERNAME:docmind}
spring.datasource.password=${DATABASE_PASSWORD:docmind}

# Ensure pgvector is available before Hibernate maps vector columns
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS vector

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT — development fallback is unsafe for production. Use profile "prod".
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
app.jwt.require-strong-secret=false

# Embedding service
app.embedding.base-url=${EMBEDDING_BASE_URL:http://127.0.0.1:8000}
app.embedding.dimension=384

# Uploads (relative to the process working directory)
app.upload.dir=${UPLOAD_DIR:uploads}

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.springframework.security=WARN
logging.level.docmind=INFO
logging.level.org.hibernate.SQL=WARN
