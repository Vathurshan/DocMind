spring.application.name=docmind

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/docmind
spring.datasource.username=docmind
spring.datasource.password=docmind

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB