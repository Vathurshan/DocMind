spring.application.name=docmind-test
app.jwt.secret=test-secret-key-that-is-at-least-32-chars-long
app.jwt.expiration-ms=86400000
app.jwt.require-strong-secret=false
app.embedding.base-url=http://127.0.0.1:9
app.embedding.dimension=384
app.upload.dir=${java.io.tmpdir}/docmind-test-uploads
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.springframework.security=WARN
